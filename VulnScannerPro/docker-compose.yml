version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: vulnscanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: securepassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://scanner:securepassword@postgres/vulnscanner
      REDIS_URL: redis://redis:6379
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: